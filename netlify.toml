# Netlify configuration. (The old `netlify-toml.txt` was inert — a .txt file is
# never read by Netlify, so the function timeout below was not actually applied.)

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Give the PDF-extraction function headroom.
[functions.analyze]
  timeout = 26

# Keep-alive: ping Supabase Mon & Thu (09:00 UTC) so the free-tier project never
# idles into an auto-pause. Max gap ~4 days, well under Supabase's 7-day window.
[functions.keepalive]
  schedule = "0 9 * * 1,4"
