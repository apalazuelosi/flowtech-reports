# Netlify configuration. (The old `netlify-toml.txt` was inert — a .txt file is
# never read by Netlify, so the function timeout below was not actually applied.)

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Give the PDF-extraction function headroom.
[functions.analyze]
  timeout = 26

# Keep-alive: ping Supabase daily (09:00 UTC) so the free-tier project never
# idles into an auto-pause. Daily gives wide margin against the 7-day window and
# any single missed run. (A GitHub Action does the same, as a verifiable backup.)
[functions.keepalive]
  schedule = "@daily"
