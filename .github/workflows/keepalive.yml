name: Keep Supabase awake

# Pings the Reports database daily so the free-tier project never sits idle for
# 7 days and auto-pauses. Runs on a schedule and can be triggered manually
# (Actions tab → this workflow → "Run workflow") to test.

on:
  schedule:
    - cron: '0 9 * * *'   # every day at 09:00 UTC
  workflow_dispatch: {}    # manual run button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            https://flowtech-reports.netlify.app/.netlify/functions/clients)
          echo "Database ping → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Database not reachable (HTTP $code) — it may be paused. Restore it in Supabase."
            exit 1
          fi
          echo "Database is awake."
